function validate(id){
  var d = D.filter(function(x){ return x.id === id; })[0];
  var correct = 0;
  d.q.forEach(function(q, i){
    var sel = document.querySelector('input[name="q' + i + '"]:checked');
    var labels = document.querySelectorAll('input[name="q' + i + '"]');
    labels.forEach(function(inp, j){
      var lbl = inp.parentElement;
      if (j === q.c) lbl.classList.add('ok');
      if (sel && +sel.value === j && j !== q.c) lbl.classList.add('ko');
    });
    var exp = document.getElementById('exp' + i);
    exp.style.display = 'block';
    exp.innerHTML = q.e;
    if (sel && +sel.value === q.c) correct++;
  });
  
  var ok = correct === d.q.length;
  var dejaValide = !!state.done[id];
  document.getElementById('res').innerHTML = '<div class="res ' + (ok?'g':'r') + '">' + (ok ? 'Defi ' + d.id + ' valide !' : 'Score : ' + correct + '/' + d.q.length + ' - Reessayez') + '</div>';
  
  if (ok && !dejaValide) {
    state.done[id] = new Date().toISOString();
    save();
    updateProg();
    var exam = EXAMS.filter(function(e){ return e.from <= id && e.to >= id; })[0];
    if (exam && isExamUnlocked(exam) && !isExamPassed(exam)) {
      document.getElementById('res').innerHTML += '<div class="res g" style="margin-top:8px">Module complete ! <a href="#" onclick="startExam(\'' + exam.id + '\');return false;">Passer l\'examen final</a></div>';
    }
  }
}

var currentExam = null;

function startExam(id){
  var ex = EXAMS.filter(function(e){ return e.id === id; })[0];
  if (!ex) return;
  if (!isExamUnlocked(ex)) { alert("Validez d'abord tous les defis du module."); return; }
  currentExam = ex;
  
  var html = '<div class="card"><div class="meta"><small>Examen ' + ex.id + '</small><small>' + ex.questions.length + ' questions</small><small>Seuil ' + Math.round(EXAM_PASS_RATIO*100) + '%</small><small class="level-tag l8">NIVEAU 8</small></div>';
  html += '<h2>' + ex.titre + '</h2>';
  html += '<div class="intro"><p><b>Instructions :</b> Repondez a toutes les questions. Il faut au moins ' + Math.ceil(ex.questions.length * EXAM_PASS_RATIO) + '/' + ex.questions.length + ' bonnes reponses.</p></div>';
  html += '<div class="quiz" id="examQuiz">';
  
  ex.questions.forEach(function(q, i){
    html += '<div class="q" data-qi="' + i + '"><b>Q' + (i+1) + '. ' + q.q + '</b>';
    q.a.forEach(function(opt, j){
      html += '<label><input type="radio" name="exam_q' + i + '" value="' + j + '"> ' + opt + '</label>';
    });
    html += '<div class="exp" id="exam_exp' + i + '"></div></div>';
  });
  
  html += '</div><div class="nav"><button class="sec" onclick="render()">Annuler</button><button class="exam" onclick="submitExam()">Valider l\'examen</button></div><div id="exam_res"></div></div>';
  
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function submitExam(){
  if (!currentExam) return;
  var ex = currentExam;
  var correct = 0;
  var details = [];
  
  ex.questions.forEach(function(q, i){
    var sel = document.querySelector('input[name="exam_q' + i + '"]:checked');
    var labels = document.querySelectorAll('input[name="exam_q' + i + '"]');
    labels.forEach(function(inp, j){
      var lbl = inp.parentElement;
      if (j === q.c) lbl.classList.add('ok');
      if (sel && +sel.value === j && j !== q.c) lbl.classList.add('ko');
    });
    var exp = document.getElementById('exam_exp' + i);
    exp.style.display = 'block';
    exp.innerHTML = q.e;
    var ok = sel && +sel.value === q.c;
    if (ok) correct++;
    details.push({q: q.q, ok: ok, correct: q.a[q.c], chosen: sel ? q.a[+sel.value] : '(aucune)'});
  });
  
  var ratio = correct / ex.questions.length;
  var passed = ratio >= EXAM_PASS_RATIO;
  var existing = state.exams[ex.id];
  if (!existing || !existing.passed || correct > existing.score) {
    state.exams[ex.id] = {score: correct, total: ex.questions.length, passed: passed, date: new Date().toISOString()};
    save();
  }
  
  var msg = '';
  if (passed) {
    msg = '<div class="res g">Examen REUSSI ! ' + correct + '/' + ex.questions.length + ' (' + Math.round(ratio*100) + '%)</div>';
    if (!existing || !existing.passed) {
      msg += '<div class="res g" style="margin-top:8px">Felicitations, module valide !</div>';
    }
  } else {
    msg = '<div class="res r">Examen echoue : ' + correct + '/' + ex.questions.length + ' (' + Math.round(ratio*100) + '%)</div>';
  }
  
  msg += '<div class="card" style="margin-top:12px"><h3>Detail des reponses</h3><table><tr><th>#</th><th>Question</th><th>Votre reponse</th><th>Bonne reponse</th><th>Statut</th></tr>';
  details.forEach(function(d, i){
    msg += '<tr><td>' + (i+1) + '</td><td>' + d.q + '</td><td>' + d.chosen + '</td><td>' + d.correct + '</td><td style="color:' + (d.ok?'#22c55e':'#ef4444') + '">' + (d.ok?'OK':'KO') + '</td></tr>';
  });
  msg += '</table></div>';
  
  msg += '<div class="nav"><button class="sec" onclick="render()">Accueil</button><button class="exam" onclick="startExam(\'' + ex.id + '\')">Repasser</button></div>';
  
  document.getElementById('exam_res').innerHTML = msg;
  updateProg();
  window.scrollTo(0, document.body.scrollHeight - 400);
}

  });
  html += '</div>';
  app.innerHTML = html;
}

function showStats(){
  var total = countTotal(), today = countToday();
  var milestonesDone = MILESTONES.filter(function(m){ return state.done[m.seuil]; });
  
  var html = '<div class="card"><button class="sec" onclick="render()">Accueil</button><h2>Statistiques</h2>';
  html += '<div class="stats-grid"><div class="stat"><span class="big">' + today + '</span><span class="lbl">Aujourdhui</span></div><div class="stat"><span class="big">' + total + '/100</span><span class="lbl">Total</span></div><div class="stat"><span class="big">' + passedExamsCount() + '/5</span><span class="lbl">Examens</span></div></div>';
  
  html += '<h3>Examens de module</h3>';
  html += '<table><tr><th>Examen</th><th>Score</th><th>Statut</th></tr>';
  EXAMS.forEach(function(ex){
    var r = state.exams && state.exams[ex.id];
    var statut = r ? (r.passed ? 'REUSSI' : 'ECHOUE') : 'Non passe';
    var color = r ? (r.passed ? '#22c55e' : '#ef4444') : '#94a3b8';
    html += '<tr><td>' + ex.titre + '</td><td>' + (r ? r.score + '/' + r.total : '-') + '</td><td style="color:' + color + ';font-weight:700">' + statut + '</td></tr>';
  });
  html += '</table>';
  
  html += '<h3>Projets majeurs atteints</h3>';
  if (milestonesDone.length === 0) {
    html += '<p style="color:#94a3b8">Aucun projet majeur encore atteint.</p>';
  } else {
    html += '<ul>';
    milestonesDone.forEach(function(m){ html += '<li><b>' + m.titre + '</b> - ' + m.date + '<br><span style="color:#94a3b8;font-size:0.85em">' + m.desc + '</span></li>'; });
    html += '</ul>';
  }
  html += '</div>';
  app.innerHTML = html;
}

function showJobs(){
  var html = '<div class="card"><button class="sec" onclick="render()">Accueil</button><h2>Emplois Transcendant</h2>';
  JOBS.forEach(function(j){
    html += '<div class="job"><h4>' + j.nom + '</h4><div style="font-size:0.75em;color:#94a3b8">' + j.type + '</div><div style="margin:6px 0;font-size:0.88em">' + j.desc + '</div><a href="' + j.url + '" target="_blank">' + j.url + '</a></div>';
  });
  html += '</div>';
  app.innerHTML = html;
}

function reset(){
  if (confirm('Reinitialiser toute la progression du Niveau 8 ?')) {
    localStorage.removeItem('cyber_ci_lvl8');
    location.reload();
  }
}

render();
</script>

</html>
